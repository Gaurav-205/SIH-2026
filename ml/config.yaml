# AtmosFusion ML pipeline configuration (single source of truth for every stage).
# Dates are ISO strings; all times UTC unless noted.

project:
  name: atmosfusion
  data_dir: ml/data          # Parquet outputs (gitignored)
  cache_dir: ml/cache        # HTTP cache + raw mirrors (gitignored)
  reports_dir: ml/reports

grid:
  step_deg: 0.25
  india_box: {lat: [5.0, 40.0], lon: [65.0, 100.0]}   # all-India is a config change later

