name: Deploy

# Publishes a fresh live forecast cycle and deploys the site + API to Vercel.
# Runs daily after the 00 UTC model runs are available, after CI passes on main, or by hand.
# Requires repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.
on:
  schedule:
    - cron: "30 5 * * *" # 11:00 IST
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The first run waits for Open-Meteo's hourly window (4,500 calls) between backfill, ERA5 and the cycle
    timeout-minutes: 180
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.lock
      - run: pip install -r ml/requirements.lock
      # Pipeline state carried between runs: live/archived forecasts, IMD truth, raw IMD grids, the
      # HTTP cache, the Open-Meteo budget ledger (about 50 MB once warm) and published cycles (history page)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ml/data
            ml/cache
            ml/exports
          key: pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-
      # Skill weights need verified errors: IMD real-time truth, ERA5 wind and archived forecasts for the last
      # ~100 days (blend window 90 days). Both are incremental; the first run costs ~4,600 of the
      # 8,500 daily Open-Meteo backfill calls, later runs only fetch new days. If either source is
      # down, the cycle still publishes with whatever history is stored (equal weights at worst).
      - name: IMD real-time truth
        continue-on-error: true
        run: python -m ml.ingest.imd_realtime --start "$(date -u -d '120 days ago' +%F)"
      - name: Recent forecast archive
        continue-on-error: true
        run: python -m ml.ingest.openmeteo --run --since today-100
      - name: ERA5 wind truth (Open-Meteo archive, ~6 days behind)
        continue-on-error: true
        run: python -m ml.ingest.era5
      # Live runs from public Open-Meteo (no key). If this fails, nothing is deployed and the
      # previous production deployment keeps serving its last publication.
      # Open-Meteo handshake/read timeouts outlast the per-request retries (2-8 s), so retry the
      # whole cycle after a long pause before giving up.
      - name: Live cycle
        run: |
          for i in 1 2 3; do
            python -m ml.daily.run_cycle --no-truth && exit 0
            [ "$i" -lt 3 ] && echo "cycle attempt $i failed, retrying in 10 min" && sleep 600
          done
          exit 1
      - run: python -m ml.evaluate.report # website copy of the committed validation report
      # Every cycle is bundled into the function, so keep about a month of history
      - run: ls -1t ml/exports/cycle_*.json | tail -n +31 | xargs -r rm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # The CLI does not pick up VERCEL_TOKEN from the environment ("No existing credentials found")
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      # Saved even when a step above failed, so a failed run does not repeat its downloads
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ml/data
            ml/cache
            ml/exports
          key: pipeline-${{ github.run_id }}-${{ github.run_attempt }}
