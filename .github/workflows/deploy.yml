name: Deploy

# Publishes a fresh live forecast cycle and deploys the site + API to Vercel.
# Runs daily after the 00 UTC model runs are available, after CI passes on main, or by hand.
# Requires repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.
on:
  schedule:
    - cron: "30 5 * * *" # 11:00 IST
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      # Stored live forecasts let a re-run for the same model run skip the API calls
      - uses: actions/cache@v4
        with:
          path: ml/data/live
          key: live-forecasts-${{ github.run_id }}
          restore-keys: live-forecasts-
      # Live runs from public Open-Meteo (no key). If this fails, nothing is deployed and the
      # previous production deployment keeps serving its last publication.
      - run: python -m ml.daily.run_cycle --no-truth
      - run: python -m ml.evaluate.report # website copy of the committed validation report
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Vercel (production)
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
