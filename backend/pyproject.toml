[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is declared in argument defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
